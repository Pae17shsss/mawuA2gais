# Terbitkan Xiaobu Kelas ke GitHub Pages setiap ada push ke cabang main.
# Sekali saja di GitHub: Settings → Pages → Source: "GitHub Actions".
name: Terbitkan ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  terbit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: rilis
        run: node build.mjs rilis
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.rilis.outputs.folder }}
      - id: deploy
        uses: actions/deploy-pages@v4
